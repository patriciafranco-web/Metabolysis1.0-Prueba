<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metabolisys - Sistema Clínico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-dark bg-dark shadow-sm py-2">
        <div class="container-fluid px-4">
            <div class="d-flex align-items-center flex-wrap">
                <a class="navbar-brand d-flex align-items-center text-white text-decoration-none m-0" href="/">
                    <i class="bi bi-heart-pulse-fill text-danger fs-3 me-2"></i>
                    <span class="fw-bold fs-4 me-3">Metabolisys</span>
                </a>
                <span class="text-warning fs-6 ps-2 border-start border-secondary">Dra. Sofía Fernández | Endocrinología y Metabolismo</span>
            </div>
            {% if session.get('user_id') %}
            <div class="d-flex align-items-center">
                <span class="text-light me-3 small"><i class="bi bi-person-circle"></i> {{ session.get('username') }}</span>
                <a href="/logout" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Salir</a>
            </div>
            {% endif %}
        </div>
    </nav>
    <div class="container my-4">
        {% block content %}{% endblock %}
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
