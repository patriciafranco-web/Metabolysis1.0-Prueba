<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metabolisys - Dra. Sofía</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body style="background-color: #121212 !important; color: white;">
    <!-- Barra Superior Fija -->
    <nav style="background-color: #1a1a1a !important; border-bottom: 2px solid #333; padding: 12px 20px; display: flex; justify-content: space-between; align-items: center;">
        
        <div style="display: flex; align-items: center; gap: 15px;">
            <!-- Logo -->
            <a href="/" style="text-decoration: none; display: flex; align-items: center; gap: 8px;">
                <i class="bi bi-heart-pulse-fill text-danger fs-2"></i>
                <span style="color: white; font-weight: bold; font-size: 1.5rem;">Metabolisys</span>
            </a>
            
            <!-- Separador y Nombre Doctora -->
            <div style="border-left: 2px solid #555; height: 30px; margin: 0 5px;"></div>
            <span style="color: #ffc107; font-weight: 600; font-size: 0.95rem;">
                Dra. Sofía Martínez <span style="color: #aaa; font-weight: 400;">| Endocrinología y Metabolismo</span>
            </span>
        </div>

        <!-- Botones Sesión -->
        {% if session.get('user_id') %}
        <div style="display: flex; align-items: center; gap: 15px;">
            <span style="color: white; font-size: 0.9rem;">
                <i class="bi bi-person-circle text-warning me-1"></i> {{ session.get('username') }}
            </span>
            <a href="/logout" class="btn btn-outline-danger btn-sm fw-bold">Salir</a>
        </div>
        {% endif %}
    </nav>

    <!-- Contenido -->
    <div class="container my-4">
        {% block content %}{% endblock %}
    </div>
</body>
</html>
