<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metabolisys - Sistema Clínico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light" style="background-color: #121212 !important;">
    <nav class="navbar navbar-dark shadow-sm" style="background-color: #1a1a1a !important; border-bottom: 1px solid #333;">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center flex-wrap">
            
            <div class="d-flex align-items-center my-1">
                <a href="/" class="text-decoration-none d-flex align-items-center me-3">
                    <i class="bi bi-heart-pulse-fill text-danger fs-3 me-2"></i>
                    <span class="text-danger fw-bold fs-4">Metabolisys</span>
                </a>
                <div class="border-start border-secondary ps-3 text-warning" style="font-size: 0.95rem;">
                    <strong>Dra. Sofía Martínez</strong> <span class="text-white-50">| Endocrinología y Metabolismo</span>
                </div>
            </div>

            {% if session.get('user_id') %}
            <div class="d-flex align-items-center my-1">
                <span class="text-light me-3 small"><i class="bi bi-person-circle"></i> {{ session.get('username') }}</span>
                <a href="/logout" class="btn btn-outline-light btn-sm"><i class="bi bi-box-arrow-right"></i> Salir</a>
            </div>
            {% endif %}
            
        </div>
    </nav>
    
    <div class="container my-4">
        {% block content %}{% endblock %}
    </div>
    
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
