<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Metabolisys - Dra. Sofía</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light" style="background-color: #121212 !important;">
    <!-- BARRA SUPERIOR FORZADA -->
    <nav class="navbar shadow-sm" style="background-color: #1a1a1a !important; border-bottom: 2px solid #333;">
        <div class="container-fluid px-4 d-flex justify-content-between align-items-center">
            
            <!-- Logo y Nombre de la Doctora -->
            <a href="/" style="text-decoration: none; display: flex; align-items: center;">
                <i class="bi bi-heart-pulse-fill text-danger fs-2 me-2"></i>
                <div style="display: flex; flex-direction: column;">
                    <span style="color: white; font-weight: bold; font-size: 1.4rem; line-height: 1;">Metabolisys</span>
                    <span style="color: #ffc107; font-size: 0.85rem; font-weight: 600;">Dra. Sofía Martínez | Endocrinología</span>
                </div>
            </a>

            <!-- Botón de Sesión -->
            {% if session.get('user_id') %}
            <div class="d-flex align-items-center">
                <span class="text-light me-3 small" style="font-weight: 500;">
                    <i class="bi bi-person-circle text-warning"></i> {{ session.get('username') }}
                </span>
                <a href="/logout" class="btn btn-outline-danger btn-sm fw-bold">
                    <i class="bi bi-box-arrow-right"></i> Salir
                </a>
            </div>
            {% endif %}

        </div>
    </nav>

    <!-- Contenido Principal -->
    <div class="container my-4">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
