<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Acceso - Metabolisys</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-dark d-flex align-items-center justify-content-center vh-100">
    <div class="card shadow-lg p-4" style="width: 100%; max-width: 400px;">
        <div class="card-body text-center">
            <h3 class="text-danger mb-1"><i class="bi bi-heart-pulse-fill"></i> METABOLISYS</h3>
            <p class="text-muted small mb-4">Sistema Clínico Diabetológico y Metabólico</p>
            
            {% if error %}
            <div class="alert alert-danger py-2 small" role="alert">
                {{ error }}
            </div>
            {% endif %}

            <form method="POST">
                <div class="mb-3 text-start">
                    <label class="form-label fw-bold small">Usuario</label>
                    <input type="text" class="form-control" name="username" placeholder="Ingrese su usuario" required>
                </div>
                <div class="mb-3 text-start">
                    <label class="form-label fw-bold small">Contraseña</label>
                    <input type="password" class="form-control" name="password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn btn-danger w-100 py-2"><i class="bi bi-box-arrow-in-right"></i> Ingresar al Sistema</button>
            </form>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
