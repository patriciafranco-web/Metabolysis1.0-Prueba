<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Modificar Plan - METABOLISYS</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body { background-color: #121212 !important; color: #e0e0e0 !important; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .card { background-color: #1e1e1e !important; border: 1px solid #333 !important; color: #ffffff !important; }
        .form-control, .form-select, textarea { background-color: #2a2a2a !important; border: 1px solid #555 !important; color: #ffffff !important; }
        .form-control:focus, .form-select:focus, textarea:focus { background-color: #333333 !important; border-color: #ff6b6b !important; color: #ffffff !important; box-shadow: none !important; }
        .form-control::placeholder, textarea::placeholder { color: #aaaaaa !important; opacity: 1; }
        label, .form-label { color: #f1f1f1 !important; }
        .btn-primary { background-color: #e63946; border: none; }
        .btn-primary:hover { background-color: #d90429; }
        input[type="text"], textarea { text-transform: capitalize; }
    </style>
</head>
<body class="py-4">
<div class="container" style="max-width: 800px;">
    <div class="card p-4 shadow-lg rounded-4">
        <h2 class="text-center text-danger fw-bold">❤️ METABOLISYS</h2>
        <h4 class="text-center mb-4">Modificar Plan y Tratamiento para: {{ patient.full_name }}</h4>
        
        <form method="POST">
            <div class="mb-3">
                <label class="form-label fw-bold">Indicaciones Generales / Plan</label>
                <textarea class="form-control" name="indicaciones_tratamiento" rows="4" placeholder="Ej. Dieta baja en carbohidratos...">{% if record %}{{ record.indicaciones_tratamiento }}{% endif %}</textarea>
            </div>
            
            <div class="mb-3">
                <label class="form-label fw-bold">Medicación (Receta)</label>
                <textarea class="form-control" name="medications" rows="3" placeholder="Ej. Metformina 850mg...">{% if record %}{{ record.medications }}{% endif %}</textarea>
            </div>
            
            <div class="row g-3 mb-4">
                <div class="col-md-6">
                    <label class="form-label fw-bold">Próximo Control</label>
                    <input type="text" class="form-control" name="proximo_control" value="{% if record %}{{ record.proximo_control }}{% endif %}" placeholder="Ej. 4 semanas">
                </div>
                <div class="col-md-6">
                    <label class="form-label fw-bold">Conducta Médica</label>
                    <textarea class="form-control" name="conducta_medica" rows="1">{% if record %}{{ record.conducta_medica }}{% endif %}</textarea>
                </div>
            </div>

            <div class="d-flex justify-content-between pt-3 border-top border-secondary">
                <a href="{{ url_for('patient_detail', id=patient.id) }}" class="btn btn-secondary">Cancelar</a>
                <button type="submit" class="btn btn-primary px-4">Guardar Plan</button>
            </div>
        </form>
    </div>
</div>

<script>
// --- SISTEMA DE AUTOGUARDADO (BORRADOR AUTOMÁTICO) ---
document.addEventListener("DOMContentLoaded", function() {
    var form = document.querySelector("form");
    if (!form) return;

    var draftKey = "draft_" + window.location.pathname;

    // 1. RECUPERAR: Si hay un borrador guardado, rellenar el formulario
    var savedDraft = localStorage.getItem(draftKey);
    if (savedDraft) {
        var formData = JSON.parse(savedDraft);
        for (var key in formData) {
            var field = form.querySelector("[name='" + key + "']");
            if (field && field.type !== "file") {
                if (field.type === "radio") {
                    var radioToCheck = form.querySelector("input[name='" + key + "'][value='" + formData[key] + "']");
                    if (radioToCheck) radioToCheck.checked = true;
                } else {
                    field.value = formData[key];
                }
            }
        }
        
        var alertDiv = document.createElement("div");
        alertDiv.className = "alert alert-success border-success text-dark py-2 mt-3 fw-bold";
        alertDiv.innerHTML = "📝 ¡Borrador recuperado! Hemos restaurado los datos que no llegaste a guardar.";
        form.insertBefore(alertDiv, form.firstChild);
    }

    // 2. AUTOGUARDAR: Cada vez que teclea algo, se guarda en tiempo real
    form.addEventListener("input", function() {
        var formData = {};
        var inputs = form.querySelectorAll("input, textarea, select");
        inputs.forEach(function(input) {
            if (input.name && input.type !== "file") {
                if (input.type === "radio") {
                    if (input.checked) formData[input.name] = input.value;
                } else {
                    formData[input.name] = input.value;
                }
            }
        });
        localStorage.setItem(draftKey, JSON.stringify(formData));
    });

    // 3. LIMPIAR Y BLOQUEAR BOTÓN: Borra el borrador al guardar y muestra aviso de carga
    form.addEventListener("submit", function() {
        localStorage.removeItem(draftKey);
        
        var btn = form.querySelector("button[type='submit']");
        if(btn) {
            btn.innerHTML = "⏳ Guardando, por favor espere...";
            btn.classList.add("disabled");
            btn.style.pointerEvents = "none";
        }
    });
});
</script>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
